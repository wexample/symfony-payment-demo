en:
  page_title: Payment
  page_icon: ph:bold/credit-card
  mine: My payments
  admin: All payments
  intro: >-
    Buy something from the catalogue below: symfony-payment-ds asks how to
    pay, then sends you to a provider — pretended here — or tells you how to
    pay by hand, and waits for the outcome. Signed in as demo-admin, the
    administration of every payment is yours too.
  catalogue:
    title: The catalogue
  cases:
    title: What to try
    paid:
      title: A payment that goes through
      text: Pay with the demo provider's card, then « Pay » on its page — or with a card through Stripe, test mode, with 4242 4242 4242 4242.
    declined:
      title: A card declined
      text: « Decline » on the provider's page; the payment can be tried again.
    canceled:
      title: A payment given up
      text: « Cancel » on the provider's page.
    manual:
      title: A transfer, confirmed by hand
      text: Pay by bank transfer; then, as demo-admin, mark it received in the administration.
    waiting:
      title: A payment left waiting
      text: « Go back without deciding » on the provider's page; the return page waits for the provider's answer, and shows it as soon as it comes.
    refund:
      title: A refund
      text: As demo-admin, refund a paid payment, in whole or in part, from its page in the administration.
